<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Курс Python · Профик Arena</title>
<script>
/* Показать ошибку вместо чёрного экрана (ловит и падения модулей, и рантайм). */
(function () {
  function showErr(msg) {
    if (document.getElementById('py-boot-error')) return;
    var d = document.createElement('div');
    d.id = 'py-boot-error';
    d.style.cssText = 'position:fixed;inset:0;background:#15161b;color:#ffd9d9;padding:18px;font:13px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;overflow:auto;z-index:99999;white-space:pre-wrap';
    d.textContent = '⚠️ Курс не загрузился.\n\n' + msg + '\n\nСделай скриншот и пришли — починим.';
    (document.body || document.documentElement).appendChild(d);
  }
  window.addEventListener('error', function (e) {
    showErr((e.message || '') + '\n' + (e.filename || '') + ':' + (e.lineno || 0) + ':' + (e.colno || 0));
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    showErr('Promise: ' + ((r && (r.stack || r.message)) || r || 'unknown'));
  });
})();
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<div id="app">

  <!-- ══ ОНБОРДИНГ ══ -->
  <section id="s-onboard" class="screen">
    <div class="onboard-wrap" id="onboard-wrap"></div>
  </section>

  <!-- ══ ДЕРЕВО ТЕМ ══ -->
  <section id="s-tree" class="screen hidden">
    <header class="tree-header">
      <button id="tree-back" class="icon-btn">←</button>
      <div class="tree-stats">
        <span class="stat-streak" id="stat-streak">🔥 0</span>
        <span class="stat-xp" id="stat-xp">⭐ 0</span>
      </div>
    </header>
    <div id="tree-scroll" class="tree-scroll">
      <div id="hero-card" class="hero-card"></div>
      <div id="profik-banner" class="profik-banner hidden"></div>
      <div class="secondary-label" id="secondary-label">Инструменты подготовки</div>
      <div id="plan-card" class="plan-card"></div>
      <div id="progress-card" class="progress-card hidden"></div>
      <div id="readiness-card" class="readiness-card hidden"></div>
      <div id="weekly-card" class="weekly-card hidden"></div>
      <div id="daily-card" class="daily-card hidden"></div>
      <div id="projects-card" class="projects-card"></div>
      <div id="videos-card" class="videos-card"></div>
      <div id="py-lb-card" class="py-lb-card hidden"></div>
      <div class="secondary-label">Программа подготовки</div>
      <div id="tree-units"></div>
    </div>
  </section>

  <!-- ══ ПЛЕЕР УРОКА ══ -->
  <section id="s-lesson" class="screen hidden">
    <header class="lesson-header">
      <button id="lesson-quit" class="icon-btn">✕</button>
      <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
      <div class="hearts" id="hearts"></div>
    </header>

    <div class="lesson-body" id="lesson-body"></div>

    <div class="lesson-footer" id="lesson-footer">
      <button id="check-btn" class="check-btn" disabled>Проверить</button>
    </div>

    <div id="feedback" class="feedback hidden">
      <div class="feedback-head" id="feedback-head"></div>
      <div class="feedback-explain" id="feedback-explain"></div>
      <button id="continue-btn" class="continue-btn">Продолжить</button>
    </div>
  </section>

  <!-- ══ ТЕОРИЯ ══ -->
  <section id="s-theory" class="screen hidden">
    <header class="theory-header">
      <button id="theory-back" class="icon-btn">←</button>
      <div class="theory-htitle" id="theory-htitle">Теория</div>
      <span style="width:40px"></span>
    </header>
    <div class="theory-scroll" id="theory-scroll"></div>
    <div class="theory-footer">
      <button id="theory-start" class="check-btn">Перейти к заданиям →</button>
    </div>
  </section>

  <!-- ══ ПРОЕКТЫ ══ -->
  <section id="s-projects" class="screen hidden">
    <header class="theory-header">
      <button id="projects-back" class="icon-btn">←</button>
      <div class="theory-htitle">🛠 Мини-проекты</div>
      <span style="width:40px"></span>
    </header>
    <div class="projects-scroll" id="projects-scroll"></div>
  </section>

  <!-- ══ ФИНАЛ ПРОЕКТА ══ -->
  <section id="s-project-done" class="screen hidden">
    <div class="projdone-wrap" id="projdone-wrap"></div>
  </section>

  <!-- ══ ВИДЕО-МАРАФОН ══ -->
  <section id="s-videos" class="screen hidden">
    <header class="theory-header">
      <button id="videos-back" class="icon-btn">←</button>
      <div class="theory-htitle">🎬 Марафон Py.Go</div>
      <span style="width:40px"></span>
    </header>
    <div class="videos-player hidden" id="videos-player"></div>
    <div class="videos-scroll" id="videos-scroll"></div>
  </section>

  <!-- ══ РЕЗУЛЬТАТ ══ -->
  <section id="s-result" class="screen hidden">
    <div class="result-wrap" id="result-wrap"></div>
  </section>

</div>
<script type="module" src="src/main.js?v=3"></script>
</body>
</html>
