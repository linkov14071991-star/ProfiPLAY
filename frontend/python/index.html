<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python-курс · Профик Арена</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ══ ОНБОРДИНГ ══ -->
  <section id="s-onboard" class="screen">
    <div class="onboard-wrap" id="onboard-wrap"></div>
  </section>

  <!-- ══ ДЕРЕВО ТЕМ ══ -->
  <section id="s-tree" class="screen hidden">
    <header class="tree-header">
      <button id="tree-back" class="icon-btn">←</button>
      <div class="tree-stats">
        <span class="stat-streak" id="stat-streak">🔥 0</span>
        <span class="stat-xp" id="stat-xp">⭐ 0</span>
      </div>
    </header>
    <div id="daily-card" class="daily-card hidden"></div>
    <div id="tree-scroll" class="tree-scroll"></div>
  </section>

  <!-- ══ ПЛЕЕР УРОКА ══ -->
  <section id="s-lesson" class="screen hidden">
    <header class="lesson-header">
      <button id="lesson-quit" class="icon-btn">✕</button>
      <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
      <div class="hearts" id="hearts"></div>
    </header>

    <div class="lesson-body" id="lesson-body"></div>

    <div class="lesson-footer" id="lesson-footer">
      <button id="check-btn" class="check-btn" disabled>Проверить</button>
    </div>

    <div id="feedback" class="feedback hidden">
      <div class="feedback-head" id="feedback-head"></div>
      <div class="feedback-explain" id="feedback-explain"></div>
      <button id="continue-btn" class="continue-btn">Продолжить</button>
    </div>
  </section>

  <!-- ══ ТЕОРИЯ ══ -->
  <section id="s-theory" class="screen hidden">
    <header class="theory-header">
      <button id="theory-back" class="icon-btn">←</button>
      <div class="theory-htitle" id="theory-htitle">Теория</div>
      <span style="width:40px"></span>
    </header>
    <div class="theory-scroll" id="theory-scroll"></div>
    <div class="theory-footer">
      <button id="theory-start" class="check-btn">Перейти к заданиям →</button>
    </div>
  </section>

  <!-- ══ РЕЗУЛЬТАТ ══ -->
  <section id="s-result" class="screen hidden">
    <div class="result-wrap" id="result-wrap"></div>
  </section>

</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
