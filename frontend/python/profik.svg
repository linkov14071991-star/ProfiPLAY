<svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#0a0a15"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a3e"/>
      <stop offset="1" stop-color="#141422"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4ff6a"/>
      <stop offset="1" stop-color="#8fce30"/>
    </radialGradient>
  </defs>

  <!-- Тень -->
  <ellipse cx="100" cy="210" rx="72" ry="6" fill="#000" opacity="0.25"/>

  <!-- Тело в толстовке -->
  <path d="M 30 210 L 30 145
           Q 30 120 55 108
           L 145 108
           Q 170 120 170 145
           L 170 210 Z"
        fill="url(#hoodie)"/>

  <!-- Плечевые складки -->
  <path d="M 40 210 L 40 165 Q 40 152 52 148 L 30 148 L 30 210 Z" fill="#000" opacity="0.35"/>
  <path d="M 160 210 L 160 165 Q 160 152 148 148 L 170 148 L 170 210 Z" fill="#000" opacity="0.35"/>

  <!-- Карман-муфта -->
  <path d="M 55 165 Q 100 178 145 165 L 148 190 Q 100 202 52 190 Z"
        fill="#000" opacity="0.5"/>

  <!-- Задняя часть капюшона (за головой) -->
  <path d="M 25 118 Q 25 55 100 50 Q 175 55 175 118 L 168 140
           Q 158 78 100 76 Q 42 78 32 140 Z"
        fill="url(#hoodie)"/>

  <!-- Уши кота -->
  <path d="M 42 68 L 40 105 L 68 82 Z" fill="#141422"/>
  <path d="M 158 68 L 160 105 L 132 82 Z" fill="#141422"/>
  <!-- Внутренняя часть ушей -->
  <path d="M 46 74 L 46 95 L 62 82 Z" fill="#B4F24D" opacity="0.4"/>
  <path d="M 154 74 L 154 95 L 138 82 Z" fill="#B4F24D" opacity="0.4"/>

  <!-- Голова -->
  <path d="M 40 118 Q 40 78 100 76 Q 160 78 160 118
           Q 160 148 130 156 L 70 156 Q 40 148 40 118 Z"
        fill="url(#face)"/>

  <!-- Передний обвод капюшона -->
  <path d="M 30 110 Q 32 72 100 68 Q 168 72 170 110 L 162 118
           Q 155 84 100 82 Q 45 84 38 118 Z"
        fill="#050510"/>

  <!-- Тень на лбу от капюшона -->
  <ellipse cx="100" cy="98" rx="55" ry="12" fill="#000" opacity="0.5"/>

  <!-- Пиксельные глаза (крупные, "thug life" стиль) -->
  <g>
    <!-- Левый глаз -->
    <rect x="55" y="110" width="34" height="20" fill="url(#eyeGlow)" rx="2"/>
    <rect x="59" y="114" width="6" height="8" fill="#0a0a15"/>
    <rect x="67" y="114" width="6" height="8" fill="#0a0a15"/>
    <rect x="75" y="114" width="6" height="8" fill="#0a0a15"/>
    <!-- Правый глаз -->
    <rect x="111" y="110" width="34" height="20" fill="url(#eyeGlow)" rx="2"/>
    <rect x="115" y="114" width="6" height="8" fill="#0a0a15"/>
    <rect x="123" y="114" width="6" height="8" fill="#0a0a15"/>
    <rect x="131" y="114" width="6" height="8" fill="#0a0a15"/>
  </g>

  <!-- Нос -->
  <path d="M 92 138 L 108 138 L 100 146 Z" fill="#B4F24D"/>

  <!-- Ротик (кошачий) -->
  <path d="M 100 146 Q 92 154 84 148" stroke="#0a0a15" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 100 146 Q 108 154 116 148" stroke="#0a0a15" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Усы -->
  <g stroke="#5a4a7c" stroke-width="1.5" stroke-linecap="round">
    <line x1="18" y1="135" x2="52" y2="138"/>
    <line x1="18" y1="145" x2="52" y2="144"/>
    <line x1="182" y1="135" x2="148" y2="138"/>
    <line x1="182" y1="145" x2="148" y2="144"/>
  </g>

  <!-- Кодовые скобки на груди (эмблема) -->
  <g>
    <rect x="66" y="176" width="68" height="26" rx="6" fill="#B4F24D"/>
    <text x="100" y="196" text-anchor="middle"
          font-family="'Courier New', 'Menlo', monospace"
          font-weight="900" font-size="18" fill="#0a0a15">&lt;/&gt;</text>
  </g>

  <!-- Блик на носу -->
  <ellipse cx="97" cy="140" rx="2" ry="1.2" fill="#e8ffb0" opacity="0.7"/>
</svg>
